name: Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - ".github/workflows/publish.yml"

concurrency:
  group: publish-go
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.head_commit != null &&
        !startsWith(github.event.head_commit.message, 'chore(release):') &&
        !contains(github.event.head_commit.message, '[skip release]')
      )
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.22", "1.23", "1.24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: go test ./...
      - run: go vet ./...

  publish:
    needs: test
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.head_commit != null &&
        !startsWith(github.event.head_commit.message, 'chore(release):') &&
        !contains(github.event.head_commit.message, '[skip release]')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Auto-bump patch version and CHANGELOG
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force
          LATEST="$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0.0.0')"
          RAW="${LATEST#v}"
          IFS=. read -r MAJOR MINOR PATCH <<<"$RAW"
          MAJOR="${MAJOR:-0}"; MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"
          PATCH=$((PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"
          NOTES="$(git log "${LATEST}..HEAD" --pretty=format:'- %s' --no-merges 2>/dev/null | sed '/^chore(release):/d' || true)"
          if [ -z "$NOTES" ]; then NOTES="- Maintenance release."; fi
          export VERSION NOTES
          sed -i 's/const Version = "[^"]*"/const Version = "'"${VERSION}"'"/' version.go
          python3 - <<'PY'
          from pathlib import Path
          import os
          v, notes = os.environ["VERSION"], os.environ["NOTES"]
          cl = Path("CHANGELOG.md")
          body = cl.read_text() if cl.exists() else "# Changelog\n\n"
          prior = body[body.index("## "):] if "## " in body else ""
          cl.write_text(f"# Changelog\n\n## {v}\n\n{notes}\n\n{prior}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.go CHANGELOG.md
          if ! git diff --cached --quiet; then
            # Local commit only — do not push to main (rules require PRs).
            # Pushing the annotated tag keeps this release commit reachable.
            git commit -m "chore(release): ${TAG}"
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"
      - name: Create and push release tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then echo "Tag exists"; exit 0; fi
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
      - name: Create module zip for GitHub Release
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          # Go consumers use the git tag; also attach a source archive for the Release page.
          git archive --format=zip --prefix="praxicraft-go-${VERSION}/" -o "praxicraft-go-${VERSION}.zip" HEAD
          git archive --format=tar.gz --prefix="praxicraft-go-${VERSION}/" -o "praxicraft-go-${VERSION}.tar.gz" HEAD
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            Go module: `go get github.com/praxicraft-platform/praxicraft-go@${{ steps.version.outputs.tag }}`
          generate_release_notes: true
          files: |
            praxicraft-go-*.zip
            praxicraft-go-*.tar.gz
