name: Publish

# Release via tags only. Bump version in version.go on main, tag, then push tag or workflow_dispatch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.0.0). Required for manual runs."
        required: true
        type: string

concurrency:
  group: publish-go
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.22", "1.23", "1.24"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: go test ./...
      - run: go vet ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "Tag must look like v1.0.0 (got: $TAG)"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG} (module version ${VERSION})"

      - name: Verify package version matches tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          GO_VER=$(grep 'const Version' version.go | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$GO_VER" != "$VERSION" ]; then
            echo "Version mismatch: tag v${VERSION}, version.go=${GO_VER}"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Create module zip for GitHub Release
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          git archive --format=zip --prefix="praxicraft-go-${VERSION}/" -o "praxicraft-go-${VERSION}.zip" HEAD
          git archive --format=tar.gz --prefix="praxicraft-go-${VERSION}/" -o "praxicraft-go-${VERSION}.tar.gz" HEAD
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body: |
            Go module: `go get github.com/praxicraft-platform/praxicraft-go@${{ steps.release.outputs.tag }}`
          generate_release_notes: true
          files: |
            praxicraft-go-*.zip
            praxicraft-go-*.tar.gz
